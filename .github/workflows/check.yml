name: Offline checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m compileall -q leaf_course scripts
      - run: python -m unittest test_stereo.py
        working-directory: leaf_course
      - run: python evaluate.py
        working-directory: leaf_course
